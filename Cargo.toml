[package]
name = "leinux"
version = "0.2.22"
edition = "2021"
description = "Native GTK4 GUI, CLI, and daemon for Leigod Accelerator on Linux"
license = "MIT"

[[bin]]
name = "leinux"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_7"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
