name: Check Leigod Upstream Core

on:
  schedule:
    # 每周一 09:00 (UTC+8) 自动对比雷神官方上游内核与 IP 库哈希
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe upstream core binary and IP database
        id: probe
        run: |
          set -euo pipefail
          pinned_ver=$(sed -n 's/^version=//p' opt/leigod/config/acc_version.ini | tr -d '[:space:]')
          pinned_bin=$(sed -n 's/^BIN_SHA256="\([0-9a-f]*\)"/\1/p' install.sh)
          pinned_xdb=$(sed -n 's/^XDB_SHA256="\([0-9a-f]*\)"/\1/p' install.sh)

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 3 -o "$tmp/acc-gw.router.amd64" "http://119.3.40.126/acc-gw.router.amd64"
          curl -fsSL --retry 3 -o "$tmp/ipdatacloud_country.xdb" "http://119.3.40.126/ipdatacloud_country.xdb"

          live_bin=$(sha256sum "$tmp/acc-gw.router.amd64" | awk '{print $1}')
          live_xdb=$(sha256sum "$tmp/ipdatacloud_country.xdb" | awk '{print $1}')
          detected_ver=$(grep -aoP 'ipPortProtocolReport\x00\K[0-9]+(?:\.[0-9]+)+' "$tmp/acc-gw.router.amd64" | head -n1 || true)
          new_ver=${detected_ver:-$pinned_ver}
          display_ver=${detected_ver:-unknown}

          echo "Pinned:   ver=$pinned_ver bin=$pinned_bin xdb=$pinned_xdb"
          echo "Upstream: ver=$display_ver bin=$live_bin xdb=$live_xdb"

          if [ "$pinned_bin" = "$live_bin" ] && [ "$pinned_xdb" = "$live_xdb" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/^version=.*/version=${new_ver}/" opt/leigod/config/acc_version.ini
          sed -i "s/^BIN_SHA256=.*/BIN_SHA256=\"${live_bin}\"/" install.sh
          sed -i "s/^XDB_SHA256=.*/XDB_SHA256=\"${live_xdb}\"/" install.sh

          {
            echo "changed=true"
            echo "pinned_ver=$pinned_ver"
            echo "new_ver=$new_ver"
            echo "display_ver=$display_ver"
            echo "pinned_bin=$pinned_bin"
            echo "live_bin=$live_bin"
            echo "pinned_xdb=$pinned_xdb"
            echo "live_xdb=$live_xdb"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update Pull Request
        if: steps.probe.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_VER: ${{ steps.probe.outputs.pinned_ver }}
          NEW_VER: ${{ steps.probe.outputs.new_ver }}
          DISPLAY_VER: ${{ steps.probe.outputs.display_ver }}
          PINNED_BIN: ${{ steps.probe.outputs.pinned_bin }}
          LIVE_BIN: ${{ steps.probe.outputs.live_bin }}
          PINNED_XDB: ${{ steps.probe.outputs.pinned_xdb }}
          LIVE_XDB: ${{ steps.probe.outputs.live_xdb }}
        run: |
          set -euo pipefail
          branch="chore/update-leigod-core"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add install.sh opt/leigod/config/acc_version.ini
          git commit -m "chore(core): update Leigod core to ${NEW_VER}"
          git push --force origin "$branch"

          title="chore(core): 更新雷神官方上游组件 (${DISPLAY_VER})"
          body=$(printf '%s\n' \
            "定时巡检检测到 \`http://119.3.40.126\` 上游组件哈希变更，已自动更新 \`install.sh\` 与 \`acc_version.ini\`。" \
            "" \
            "| 项目 | 当前锁定值 | 上游最新值 |" \
            "| :--- | :--- | :--- |" \
            "| 内核版本 (\`acc_version.ini\`) | \`${PINNED_VER}\` | \`${DISPLAY_VER}\` |" \
            "| \`acc-gw.router.amd64\` SHA-256 | \`${PINNED_BIN}\` | \`${LIVE_BIN}\` |" \
            "| \`ipdatacloud_country.xdb\` SHA-256 | \`${PINNED_XDB}\` | \`${LIVE_XDB}\` |" \
            "" \
            "合并前建议在本地拉取实测（测完切记执行 \`leinux --pause\` 暂停时长）：" \
            "\`\`\`bash" \
            "gh pr checkout ${branch} && sudo ./install.sh && leinux --start && leinux --pause" \
            "\`\`\`")

          existing=$(gh pr list --repo "${{ github.repository }}" --head "$branch" --state open --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "${{ github.repository }}" --title "$title" --body "$body"
          else
            gh pr create --repo "${{ github.repository }}" --base main --head "$branch" --title "$title" --body "$body"
          fi
