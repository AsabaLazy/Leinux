<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Leinux</title>
  <style>
    :root {
      --bg-light: #f5f5f5;
      --bg-dark: #141414;
      --surface-light: #ffffff;
      --surface-dark: #1f1f1f;
      --surface-alt-light: #f0f0f0;
      --surface-alt-dark: #262626;
      --surface-hover-light: #e6e6e6;
      --surface-hover-dark: #303030;
      --text-light: #1a1a1a;
      --text-dark: #e6e6e6;
      --muted-light: #737373;
      --muted-dark: #8c8c8c;
      --border-light: rgba(0, 0, 0, 0.1);
      --border-dark: rgba(255, 255, 255, 0.1);

      --cta-bg-light: #1a1a1a;
      --cta-bg-dark: #e6e6e6;
      --cta-text-light: #ffffff;
      --cta-text-dark: #141414;

      --ok-light: #0bb07b;
      --ok-dark: #1bb373;
      --warn-light: #d96b10;
      --warn-dark: #f37f19;
      --err-light: #c92c2f;
      --err-dark: #da3639;

      --bg: var(--bg-light);
      --surface: var(--surface-light);
      --surface-alt: var(--surface-alt-light);
      --surface-hover: var(--surface-hover-light);
      --text: var(--text-light);
      --muted: var(--muted-light);
      --border: var(--border-light);
      --cta-bg: var(--cta-bg-light);
      --cta-text: var(--cta-text-light);
      --ok: var(--ok-light);
      --warn: var(--warn-light);
      --err: var(--err-light);

      @media (prefers-color-scheme: dark) {
        --bg: var(--bg-dark);
        --surface: var(--surface-dark);
        --surface-alt: var(--surface-alt-dark);
        --surface-hover: var(--surface-hover-dark);
        --text: var(--text-dark);
        --muted: var(--muted-dark);
        --border: var(--border-dark);
        --cta-bg: var(--cta-bg-dark);
        --cta-text: var(--cta-text-dark);
        --ok: var(--ok-dark);
        --warn: var(--warn-dark);
        --err: var(--err-dark);
      }

      @supports (color: light-dark(white, black)) {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --surface: light-dark(var(--surface-light), var(--surface-dark));
        --surface-alt: light-dark(var(--surface-alt-light), var(--surface-alt-dark));
        --surface-hover: light-dark(var(--surface-hover-light), var(--surface-hover-dark));
        --text: light-dark(var(--text-light), var(--text-dark));
        --muted: light-dark(var(--muted-light), var(--muted-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --cta-bg: light-dark(var(--cta-bg-light), var(--cta-bg-dark));
        --cta-text: light-dark(var(--cta-text-light), var(--cta-text-dark));
        --ok: light-dark(var(--ok-light), var(--ok-dark));
        --warn: light-dark(var(--warn-light), var(--warn-dark));
        --err: light-dark(var(--err-light), var(--err-dark));
      }

      color-scheme: light dark;
      accent-color: var(--ok);
    }

    @media (forced-colors: active) {
      :root {
        --border: CanvasText;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "PingFang SC", "Noto Sans CJK SC", system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-block-size: 100dvb;
    }

    .shell {
      inline-size: min(860px, 100%);
      margin-inline: auto;
      padding-block: clamp(1.5rem, 7vh, 4rem) 2.5rem;
      padding-inline: 1.5rem;
      display: grid;
      gap: 0.95rem;
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      flex-wrap: wrap;
      align-items: safe center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 0.7rem;
      padding-inline: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.85rem;
    }

    .brand-text {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .brand-name {
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: ui-monospace, "JetBrains Mono", monospace;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: safe center;
      gap: 0.5rem;
    }

    .pill {
      display: inline-flex;
      align-items: safe center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
    }

    .pill.ok { color: var(--ok); }
    .pill.warn { color: var(--warn); }
    .pill.err { color: var(--err); }

    /* Hero Bento Grid */
    .bento-hero {
      display: grid;
      grid-template-columns: 1.08fr 1fr;
      gap: 0.95rem;
    }

    @media (max-width: 780px) {
      .bento-hero {
        grid-template-columns: 1fr;
      }
    }

    .matte-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.35rem 1.45rem;
      min-inline-size: 0;
    }

    .hero-core {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.15rem;
    }

    .hero-status-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-inline-size: 0;
    }

    .hero-headline {
      font-size: 1.55rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.2;
    }

    .mono-tag {
      font-family: ui-monospace, "JetBrains Mono", monospace;
      font-size: 0.74rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .hero-metrics-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      padding-block: 1.15rem;
      border-block: 1px solid var(--border);
    }

    .strip-item {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .strip-label {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 500;
    }

    .strip-val {
      font-size: 1.05rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 0.65rem;
      position: relative;
    }

    /* Region Select & Fallback Dropdown */
    select,
    select::picker(select) {
      appearance: base-select;
    }

    .region-select {
      flex: 1;
      min-inline-size: 240px;
      font-weight: 600;
      font-size: 0.85rem;
      padding-block: 0.52rem;
      padding-inline: 0.85rem;
      border-radius: 8px;
      background-color: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      display: inline-flex;
      align-items: safe center;
      justify-content: space-between;
      gap: 0.6rem;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }

    .region-select:hover {
      background-color: var(--surface-hover);
      border-color: color-mix(in oklab, var(--text), var(--border) 72%);
    }

    .region-select:focus-visible {
      outline: none;
      border-color: color-mix(in oklab, var(--text), var(--border) 50%);
    }

    select::picker(select) {
      background-color: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.3rem;
      margin-block-start: 0.3rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }

    select::picker-icon {
      color: var(--muted);
      transition: transform 0.15s ease;
    }

    select:open::picker-icon {
      transform: rotate(180deg);
    }

    select option {
      display: flex;
      align-items: safe center;
      justify-content: flex-start;
      gap: 0.5rem;
      padding-block: 0.46rem;
      padding-inline: 0.65rem;
      border-radius: 6px;
      font-size: 0.83rem;
      font-weight: 550;
      color: var(--text);
      background-color: transparent;
      cursor: pointer;
      text-align: start;
      transition: background-color 0.12s ease;
    }

    select option:hover,
    select option:focus {
      background-color: var(--surface-alt);
      color: var(--text);
      outline: none;
    }

    select option:checked {
      background-color: var(--surface-hover);
      color: var(--text);
      font-weight: 650;
    }

    select option::checkmark {
      color: var(--ok);
      font-weight: 700;
    }

    .custom-select-wrap {
      flex: 1;
      min-inline-size: 240px;
      position: relative;
      display: flex;
    }

    .custom-select-menu {
      position: absolute;
      inset-block-start: calc(100% + 4px);
      inset-inline: 0;
      z-index: 60;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.3rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      max-block-size: 320px;
      overflow-y: auto;
      display: grid;
      gap: 2px;
    }

    .custom-select-menu[hidden] {
      display: none;
    }

    .custom-opt {
      display: flex;
      align-items: safe center;
      justify-content: flex-start;
      gap: 0.5rem;
      padding-block: 0.46rem;
      padding-inline: 0.65rem;
      border-radius: 6px;
      font-size: 0.83rem;
      font-weight: 550;
      color: var(--text);
      background: transparent;
      border: none;
      inline-size: 100%;
      text-align: start;
      cursor: pointer;
    }

    .custom-opt:hover {
      background: var(--surface-alt);
    }

    .custom-opt.selected {
      background: var(--surface-hover);
      font-weight: 650;
    }

    #hero-main-btn {
      padding-block: 0.56rem;
      padding-inline: 1.25rem;
      font-size: 0.86rem;
      white-space: nowrap;
    }

    /* Telemetry & Account Cards */
    .hero-side {
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 0.95rem;
    }

    .telemetry-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.55rem;
      padding: 1.1rem 1.35rem;
    }

    .telemetry-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .speed-pair {
      display: flex;
      gap: 1.5rem;
      font-variant-numeric: tabular-nums;
    }

    .speed-block {
      display: flex;
      flex-direction: column;
    }

    .speed-dir {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
    }

    .speed-num {
      font-size: 1.2rem;
      font-weight: 750;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .sparkline-box {
      inline-size: 100%;
      block-size: 38px;
      overflow: hidden;
      position: relative;
    }

    .sparkline-svg {
      inline-size: 100%;
      block-size: 100%;
      display: block;
    }

    .telemetry-foot {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .account-card {
      padding: 1.05rem 1.35rem;
      display: flex;
      flex-wrap: wrap;
      align-items: safe center;
      justify-content: space-between;
      gap: 1rem;
    }

    .acct-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .acct-head {
      display: flex;
      align-items: safe center;
      gap: 2.25rem;
    }

    .acct-time {
      font-size: 1.15rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .acct-sub {
      font-size: 0.76rem;
      color: var(--muted);
    }

    /* Controls & Buttons */
    button,
    select,
    input {
      font: inherit;
      font-size: 0.82rem;
      color: var(--text);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding-block: 0.48rem;
      padding-inline: 0.88rem;
      transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }

    input:focus-visible,
    button:focus-visible {
      outline: none;
      border-color: color-mix(in oklab, var(--text), var(--border) 50%);
    }

    button {
      cursor: pointer;
      font-weight: 550;
      display: inline-flex;
      align-items: safe center;
      justify-content: center;
      gap: 0.38rem;
    }

    button:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: color-mix(in oklab, var(--text), var(--border) 75%);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button.btn-primary {
      background: var(--cta-bg);
      color: var(--cta-text);
      border-color: transparent;
      font-weight: 650;
    }

    button.btn-primary:hover:not(:disabled) {
      background: color-mix(in oklab, var(--cta-bg), var(--surface) 14%);
      border-color: transparent;
    }

    button.btn-danger {
      color: var(--muted);
    }

    button.btn-danger:hover:not(:disabled) {
      color: var(--err);
      border-color: color-mix(in oklab, var(--err), var(--border) 55%);
      background: color-mix(in oklab, var(--err), var(--surface-alt) 92%);
    }

    button.btn-sm {
      padding-block: 0.34rem;
      padding-inline: 0.65rem;
      font-size: 0.76rem;
      border-radius: 6px;
    }

    /* Settings Dialog */
    dialog {
      inline-size: min(560px, 92vw);
      max-block-size: 86vh;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.35rem 1.45rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.65);
    }

    .dialog-head {
      display: flex;
      align-items: safe center;
      justify-content: space-between;
      margin-block-end: 1.1rem;
      padding-block-end: 0.75rem;
      border-block-end: 1px solid var(--border);
    }

    .dialog-head h2 {
      margin: 0;
      font-size: 0.98rem;
    }

    .dialog-close-form {
      margin: 0;
    }

    .dialog-section {
      margin-block-end: 1.1rem;
      padding-block-end: 1.1rem;
      border-block-end: 1px solid var(--border);
    }

    .dialog-section:last-of-type {
      border-block-end: none;
      margin-block-end: 0;
      padding-block-end: 0;
    }

    .dialog-section h3 {
      font-size: 0.82rem;
      color: var(--text);
      font-weight: 650;
      margin: 0 0 0.55rem 0;
    }

    .field-hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0 0 0.45rem 0;
    }

    .input-row {
      display: flex;
      align-items: stretch;
      gap: 0.5rem;
    }

    .input-row input {
      flex: 1;
      min-inline-size: 0;
    }

    .input-row button {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .maint-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem;
    }

    .inline-check {
      display: inline-flex;
      align-items: safe center;
      gap: 0.42rem;
      margin-block-start: 0.65rem;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
    }

    .toast {
      position: fixed;
      inset-block-end: 1.5rem;
      inset-inline-end: 1.5rem;
      z-index: 99;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding-block: 0.6rem;
      padding-inline: 1rem;
      font-size: 0.82rem;
      font-weight: 550;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="navbar">
      <div class="brand">
        <div class="brand-text">
          <span class="brand-name">Leinux</span>
          <span class="brand-sub" id="nav-sub">v1.3.0.02</span>
        </div>
        <span id="svc-badge" class="pill ok">
          <span id="svc-badge-text">服务运行中</span>
        </span>
      </div>
      <div class="nav-actions">
        <button class="btn-sm" onclick="document.getElementById('settings-dialog').showModal()">账号与设置</button>
      </div>
    </header>

    <section class="bento-hero" aria-label="核心加速控制台">
      <article class="matte-card hero-core">
        <div class="hero-status-info">
          <h1 class="hero-headline" id="stat-acc">待加速</h1>
        </div>

        <div class="hero-metrics-strip">
          <div class="strip-item">
            <span class="strip-label">节点延迟</span>
            <span class="strip-val" id="stat-delay">- ms</span>
          </div>
          <div class="strip-item">
            <span class="strip-label">丢包率</span>
            <span class="strip-val" id="stat-loss">0 %</span>
          </div>
          <div class="strip-item">
            <span class="strip-label">外网连接状态</span>
            <span class="strip-val" id="stat-netstate">连通正常</span>
          </div>
        </div>

        <div class="hero-actions">
          <div class="custom-select-wrap" id="region-select-wrap">
            <select id="region-select" name="region" class="region-select" aria-label="选择加速区服" onchange="onRegionSelectChange()">
              <option value="0">中国香港</option>
            </select>
            <div id="custom-region-menu" class="custom-select-menu" role="listbox" aria-label="选择加速区服" hidden></div>
          </div>
          <button id="hero-main-btn" class="btn-primary" onclick="handleHeroMainAction()">启动加速</button>
        </div>
      </article>

      <div class="hero-side">
        <article class="matte-card telemetry-card">
          <div class="telemetry-top">
            <div class="speed-pair">
              <div class="speed-block">
                <span class="speed-dir">下行速率</span>
                <span class="speed-num" id="speed-down">0 B/s</span>
              </div>
              <div class="speed-block">
                <span class="speed-dir">上行速率</span>
                <span class="speed-num" id="speed-up">0 B/s</span>
              </div>
            </div>
            <span class="mono-tag" id="traffic-iface-tag">tun_PC</span>
          </div>

          <div class="sparkline-box" aria-hidden="true">
            <svg class="sparkline-svg" viewBox="0 0 300 64" preserveAspectRatio="none">
              <path id="spark-area" d="M0,64 L300,64 Z" fill="rgba(27, 179, 115, 0.10)"></path>
              <path id="spark-line" d="M0,62 L300,62" fill="none" stroke="#1bb373" stroke-width="1.75" stroke-linecap="round"></path>
            </svg>
          </div>

          <div class="telemetry-foot">
            <span id="stat-traffic">累计: 下行 0 B / 上行 0 B</span>
            <span id="stat-udp6066">监听正常 (6066/udp)</span>
          </div>
        </article>

        <article class="matte-card account-card">
          <div class="acct-info">
            <div class="acct-head">
              <span class="strip-label">雷神账号时长</span>
              <span id="acct-badge" class="pill"><span id="acct-badge-text">同步中</span></span>
            </div>
            <div class="acct-time" id="acct-time-text">--</div>
            <div class="acct-sub" id="acct-sub-text">账号: --</div>
          </div>
          <div class="nav-actions">
            <button id="acct-toggle-btn" class="btn-sm" onclick="recoverAccountTime()">恢复时长</button>
          </div>
        </article>
      </div>
    </section>
  </div>

  <dialog id="settings-dialog" closedby="any" aria-labelledby="settings-title">
    <div class="dialog-head">
      <h2 id="settings-title">账号与系统设置</h2>
      <form method="dialog" class="dialog-close-form">
        <button type="submit" class="btn-sm">关闭 (Esc)</button>
      </form>
    </div>

    <div class="dialog-section">
      <h3>1. 雷神官网账号 Token</h3>
      <p class="field-hint">登录 www.leigod.com 按 F12 控制台粘贴提取命令获取，用于暂停与恢复时长</p>
      <div class="input-row">
        <input id="acct-token-input" type="password" placeholder="粘贴 account_token 或完整 JSON">
        <button class="btn-sm" onclick="copyF12Snippet()">复制提取命令</button>
        <button class="btn-primary btn-sm" onclick="saveAccountToken()">保存 Token</button>
      </div>
      <label class="inline-check">
        <input type="checkbox" id="auto-pause-stop" checked onchange="saveAutoPauseSetting()">
        <span>关机 / 停止服务时自动暂停时长</span>
      </label>
    </div>

    <div class="dialog-section">
      <h3>2. 直连 / 软路由 DNS</h3>
      <p class="field-hint">用于非游戏域名解析，留空则自动使用当前默认网关 DNS</p>
      <div class="input-row">
        <input id="custom-dns-input" type="text" placeholder="自动检测当前默认网关 DNS">
        <button class="btn-primary btn-sm" onclick="saveCustomDns()">保存 DNS</button>
      </div>
    </div>

    <div class="dialog-section">
      <h3>3. 服务与网络维护</h3>
      <input id="token-input" type="hidden">
      <input id="userid-input" type="hidden">
      <div class="maint-grid">
        <button class="btn-sm" onclick="restartPluginService()">重启守护服务</button>
        <button class="btn-sm" onclick="sendCmd('AUTOREPAIRBOUND', { rToken: getToken(), userId: getUserId() })">修复设备绑定</button>
        <button class="btn-sm btn-danger" onclick="cleanupNetRules()">清理防火墙规则</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = (id) => document.getElementById(id);

    const settingsDialog = $('settings-dialog');
    if (!('closedBy' in HTMLDialogElement.prototype)) {
      settingsDialog.addEventListener('click', (event) => {
        if (event.target !== settingsDialog) return;
        const r = settingsDialog.getBoundingClientRect();
        const inside = r.top <= event.clientY && event.clientY <= r.bottom && r.left <= event.clientX && event.clientX <= r.right;
        if (!inside) settingsDialog.close();
      });
    }

    let tagCounter = 1;
    let pollTicks = 0;
    let lastRx = null;
    let lastTx = null;
    let lastStatTime = null;
    let savedProfiles = [];
    let activeAreaCode = '';
    let isAccelerating = false;
    let toastTimer = null;
    const speedHistory = new Array(28).fill(0);
    const supportsBaseSelect = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('appearance', 'base-select');

    function showToast(text) {
      const el = $('toast');
      el.textContent = text;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
    }

    const getToken = () => $('token-input').value.trim();
    const getUserId = () => $('userid-input').value.trim();

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatBytes(bytes, decimals = 2) {
      const n = Number(bytes) || 0;
      if (n < 1024) return `${Math.round(n)} B`;
      if (n < 1048576) return `${(n / 1024).toFixed(decimals)} KiB`;
      if (n < 1073741824) return `${(n / 1048576).toFixed(decimals)} MiB`;
      return `${(n / 1073741824).toFixed(decimals)} GiB`;
    }

    function updateSparkline(newRateBytes) {
      speedHistory.push(Math.max(0, Number(newRateBytes) || 0));
      if (speedHistory.length > 28) speedHistory.shift();
      const maxVal = Math.max(1024, ...speedHistory);
      const pts = speedHistory.map((v, i) => {
        const x = (i / (speedHistory.length - 1)) * 300;
        const y = 60 - (v / maxVal) * 52;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      $('spark-line').setAttribute('d', `M${pts.join(' L')}`);
      $('spark-area').setAttribute('d', `M0,64 L${pts.join(' L')} L300,64 Z`);
    }

    function parseDataField(data) {
      if (typeof data === 'string' && (data.startsWith('{') || data.startsWith('['))) {
        try { return JSON.parse(data); } catch (_) { return data; }
      }
      return data;
    }

    async function apiPost(path, body = {}) {
      const resp = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      return resp.json();
    }

    async function sendCmd(cmd, dataObj = {}, quiet = false) {
      try {
        const resJson = await apiPost('/api/ws-rpc', {
          cmd,
          tag: String(tagCounter++),
          sn: '',
          cli: 'webui',
          code: 0,
          err: '',
          data: dataObj,
        });
        resJson.data = parseDataField(resJson.data);
        handleIncomingResponse(resJson);
        if (!quiet) showToast(`${cmd} 已执行`);
      } catch (_) {
        if (!quiet) showToast(`调用 ${cmd} 失败`);
      }
    }

    function handleIncomingResponse(msg) {
      const cmd = (msg.cmd || '').toUpperCase();
      const d = msg.data || {};

      if (cmd === 'GETROUTERINFO' || cmd === 'GETINFO' || cmd === 'ROUTERINFO') {
        const info = d.routerInfo || d;
        if (info.appver) $('nav-sub').textContent = `v${info.appver}`;
        if (info.token && !info.token.startsWith('<') && !getToken()) {
          $('token-input').value = info.token;
        }
      } else if (cmd === 'GETACCINFO' || cmd === 'GETACC' || cmd === 'ACCINFO') {
        const acc = d.accInfo || d;
        if (isAccelerating && acc.netDelay !== undefined && Number(acc.netDelay) > 0) {
          $('stat-delay').textContent = `${acc.netDelay} ms`;
          $('stat-loss').textContent = `${acc.lossRate ?? 0} %`;
        } else if (!isAccelerating) {
          $('stat-delay').textContent = '- ms';
          $('stat-loss').textContent = '0 %';
        }
      } else if (cmd === 'LISTGAMEDEVICES' || cmd === 'GETDEVICELIST' || cmd === 'DEVICELIST') {
        const list = (d.listGameDevices && d.listGameDevices.list) || d.list || (Array.isArray(d) ? d : []);
        if (!Array.isArray(list) || !list.length) return;
        const activeItem = list.find((item) => Number(item.accState) === 1 || Number(item.state) === 1 || item.accState === 'started');
        if (activeItem) {
          isAccelerating = true;
          const area = String(activeItem.area || activeAreaCode || 'HK').toUpperCase();
          activeAreaCode = area;
          const matchProf = savedProfiles.find((p) => String(p.area || '').toUpperCase() === area);
          $('stat-acc').textContent = `${matchProf ? matchProf.name : area} · 加速中`;
          $('hero-main-btn').textContent = '停止加速并暂停时长';
        } else {
          isAccelerating = false;
          activeAreaCode = '';
          $('stat-acc').textContent = '待加速';
          $('hero-main-btn').textContent = '启动加速';
          $('stat-delay').textContent = '- ms';
          $('stat-loss').textContent = '0 %';
        }
        renderProfiles(savedProfiles);
      } else if (cmd === 'GETNETWORKSTATE' || cmd === 'NETWORKSTATE') {
        const ns = d.networkState || d;
        if (ns.state !== undefined) {
          $('stat-netstate').textContent = ns.state === 4 ? '连通正常' : `状态 ${ns.state}`;
        }
      }
    }

    if (!supportsBaseSelect) {
      document.addEventListener('DOMContentLoaded', () => {
        const sel = $('region-select');
        const menu = $('custom-region-menu');
        const wrap = $('region-select-wrap');
        if (!sel || !menu || !wrap) return;
        sel.addEventListener('mousedown', (e) => {
          e.preventDefault();
          menu.hidden = !menu.hidden;
        });
        sel.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            menu.hidden = !menu.hidden;
          } else if (e.key === 'Escape') {
            menu.hidden = true;
          }
        });
        document.addEventListener('click', (e) => {
          if (!wrap.contains(e.target)) menu.hidden = true;
        });
      });
    }

    function renderProfiles(profiles) {
      savedProfiles = profiles || [];
      const sel = $('region-select');
      const menu = $('custom-region-menu');
      if (!sel) return;
      const prevIdx = sel.value;

      if (!savedProfiles.length) {
        sel.innerHTML = '<option value="-1">暂无区服存档（请先在手机 App 任意点一次加速）</option>';
        if (menu) menu.innerHTML = '';
        return;
      }

      sel.innerHTML = savedProfiles
        .map((p, idx) => `<option value="${idx}">${escapeHtml(p.name || p.id)}</option>`)
        .join('');

      let targetIdx = 0;
      if (isAccelerating && activeAreaCode) {
        const activeIdx = savedProfiles.findIndex((p) => String(p.area || '').toUpperCase() === activeAreaCode);
        if (activeIdx >= 0) targetIdx = activeIdx;
      } else if (prevIdx !== '' && Number(prevIdx) >= 0 && Number(prevIdx) < savedProfiles.length) {
        targetIdx = Number(prevIdx);
      }
      sel.value = String(targetIdx);

      if (menu && !supportsBaseSelect) {
        menu.innerHTML = savedProfiles
          .map((p, idx) => {
            const isSel = idx === targetIdx;
            return `<button type="button" role="option" aria-selected="${isSel}" class="custom-opt${isSel ? ' selected' : ''}" onclick="selectCustomRegion(${idx})">${escapeHtml(p.name || p.id)}</button>`;
          })
          .join('');
      }
    }

    async function selectCustomRegion(idx) {
      const sel = $('region-select');
      const menu = $('custom-region-menu');
      if (sel) sel.value = String(idx);
      if (menu) menu.hidden = true;
      renderProfiles(savedProfiles);
      await onRegionSelectChange();
    }

    async function onRegionSelectChange() {
      const idx = Number($('region-select').value);
      if (isAccelerating && idx >= 0 && idx < savedProfiles.length) {
        await startSavedProfile(idx);
      }
    }

    async function handleHeroMainAction() {
      if (isAccelerating) {
        await pauseAccountTime();
      } else if (savedProfiles.length > 0) {
        const idx = Math.max(0, Number($('region-select')?.value || 0));
        await startSavedProfile(idx);
      }
    }

    async function startSavedProfile(idx) {
      const p = savedProfiles[idx];
      if (!p) return;
      activeAreaCode = String(p.area || 'HK').toUpperCase();
      showToast(`正在恢复时长并启动 ${p.name}...`);
      try { await apiPost('/api/account/recover'); } catch (_) {}
      let parsedConf = p.conf;
      if (typeof parsedConf === 'string') {
        try { parsedConf = JSON.parse(parsedConf); } catch (_) {}
      }
      await sendCmd('STARTACC', {
        token: getToken(),
        catalog: Number(p.catalog || 2),
        subCatalog: Number(p.subCatalog || 0),
        conf: parsedConf,
      });
      await loadAccountStatus();
      await refreshAll();
    }

    try {
      const cachedAcct = JSON.parse(localStorage.getItem('leigod_acct_cache') || 'null');
      if (cachedAcct && cachedAcct.time) {
        $('acct-badge').className = cachedAcct.badgeClass || 'pill ok';
        $('acct-badge-text').textContent = cachedAcct.badgeText || '已暂停';
        $('acct-time-text').textContent = cachedAcct.time;
        $('acct-sub-text').textContent = cachedAcct.sub || '';
      }
    } catch (_) {}

    async function loadAccountStatus() {
      try {
        const resp = await fetch('/api/account/status');
        const data = await resp.json();
        if (data.auto_pause_on_stop !== undefined) {
          $('auto-pause-stop').checked = Boolean(data.auto_pause_on_stop);
        }
        const dnsInput = $('custom-dns-input');
        if (dnsInput) {
          if (data.detected_gateway_dns) {
            dnsInput.placeholder = `留空自动使用当前网关 (${data.detected_gateway_dns})`;
          }
          if (data.custom_dns !== undefined && document.activeElement !== dnsInput) {
            dnsInput.value = data.custom_dns || '';
          }
        }
        const badge = $('acct-badge');
        const badgeText = $('acct-badge-text');
        const timeEl = $('acct-time-text');
        const subEl = $('acct-sub-text');
        const toggleBtn = $('acct-toggle-btn');

        if (!data.configured) {
          badge.className = 'pill warn';
          badgeText.textContent = '未配置 Token';
          timeEl.textContent = '点击右上角“账号与设置”配置 Token';
          subEl.textContent = '账号: 未登录';
          toggleBtn.textContent = '配置 Token';
          toggleBtn.onclick = () => settingsDialog.showModal();
          localStorage.removeItem('leigod_acct_cache');
          return;
        }

        const r = data.response || {};
        if (r.code === 0 && r.data) {
          const d = r.data;
          const paused = Number(d.pause_status_id) === 1;
          const sec = Number(d.expiry_time_samp || d.user_pause_time || 0);
          const hours = Math.floor(sec / 3600);
          const mins = Math.floor((sec % 3600) / 60);
          badge.className = paused ? 'pill ok' : 'pill warn';
          badgeText.textContent = paused ? '已暂停' : '计时中';
          timeEl.textContent = sec > 0 ? `剩余 ${hours} 小时 ${mins} 分` : (d.expiry_time || '已登录');
          subEl.textContent = `账号: ${d.nickname || d.mobile || '已认证'}`;
          toggleBtn.textContent = paused ? '恢复时长' : '暂停时长';
          toggleBtn.onclick = paused ? recoverAccountTime : pauseAccountTime;
          try {
            localStorage.setItem('leigod_acct_cache', JSON.stringify({
              badgeClass: badge.className,
              badgeText: badgeText.textContent,
              time: timeEl.textContent,
              sub: subEl.textContent,
            }));
          } catch (_) {}
        } else {
          badge.className = 'pill err';
          badgeText.textContent = 'Token 过期';
          timeEl.textContent = r.msg || '请重新粘贴官网 account_token';
        }
      } catch (_) {}
    }

    async function saveAccountToken() {
      await apiPost('/api/account/save-token', {
        account_token: $('acct-token-input').value.trim(),
        auto_pause_on_stop: $('auto-pause-stop').checked,
      });
      $('acct-token-input').value = '';
      showToast('已保存官网 Token 并更新时长');
      await loadAccountStatus();
    }

    async function saveAutoPauseSetting() {
      const autoPause = $('auto-pause-stop').checked;
      await apiPost('/api/account/save-token', { auto_pause_on_stop: autoPause });
      showToast(autoPause ? '已开启关机自动暂停时长' : '已关闭关机自动暂停时长');
    }

    async function saveCustomDns() {
      const dnsVal = $('custom-dns-input').value.trim();
      await apiPost('/api/account/save-token', { custom_dns: dnsVal });
      showToast(dnsVal ? `已保存自定义直连 DNS: ${dnsVal}` : '已恢复自动使用默认网关 DNS');
      await loadHostStatus();
      await loadAccountStatus();
    }

    async function pauseAccountTime() {
      showToast('正在断开隧道并暂停账号时长...');
      const res = await apiPost('/api/account/pause');
      showToast(res.local_only ? res.msg : (res.code === 0 ? '已停止加速并成功暂停账号时长' : `已停止加速 (${res.msg || '官网暂停失败'})`));
      await loadAccountStatus();
      await refreshAll();
    }

    async function recoverAccountTime() {
      const res = await apiPost('/api/account/recover');
      showToast(res.code === 0 ? '已恢复雷神账号时长' : `恢复返回: ${res.msg || '请先配置官网 Token'}`);
      await loadAccountStatus();
    }

    function copyF12Snippet() {
      const snippet = 'copy(JSON.parse(localStorage.getItem("account_token")).account_token)';
      navigator.clipboard.writeText(snippet).catch(() => {});
      showToast('已复制 F12 提取命令到剪贴板');
    }

    async function cleanupNetRules() {
      await apiPost('/api/cleanup-net');
      showToast('已清理残留网络规则');
      await loadHostStatus();
    }

    async function restartPluginService() {
      showToast('正在重启加速守护服务...');
      await apiPost('/api/service-restart');
      showToast('加速守护服务已重启');
      setTimeout(refreshAll, 1500);
    }

    async function loadHostStatus() {
      try {
        const resp = await fetch('/api/host-status');
        const info = await resp.json();
        const svcBadge = $('svc-badge');
        const svcText = $('svc-badge-text');
        if (info.service_active) {
          svcText.textContent = '服务运行中';
          svcBadge.className = 'pill ok';
        } else {
          svcText.textContent = `服务异常 (${info.service_state || '停止'})`;
          svcBadge.className = 'pill err';
        }
        if (info.udp_6066) $('stat-udp6066').textContent = info.udp_6066;
        if (info.version) $('nav-sub').textContent = `v${info.version}`;
        if (info.token && !getToken()) $('token-input').value = info.token;
        if (info.user_id && !getUserId()) $('userid-input').value = info.user_id;

        if (info.rx_bytes !== undefined && info.tx_bytes !== undefined) {
          const rx = Number(info.rx_bytes) || 0;
          const tx = Number(info.tx_bytes) || 0;
          const now = Date.now();
          if (lastRx !== null && lastStatTime !== null && now > lastStatTime) {
            const dt = (now - lastStatTime) / 1000;
            const rxRate = Math.max(0, (rx - lastRx) / dt);
            const txRate = Math.max(0, (tx - lastTx) / dt);
            $('speed-down').textContent = `${formatBytes(rxRate, 0)}/s`;
            $('speed-up').textContent = `${formatBytes(txRate, 0)}/s`;
            updateSparkline(rxRate + txRate);
          }
          lastRx = rx;
          lastTx = tx;
          lastStatTime = now;
          if (info.traffic_iface) $('traffic-iface-tag').textContent = info.traffic_iface;
          $('stat-traffic').textContent = `累计: 下行 ${formatBytes(rx)} / 上行 ${formatBytes(tx)}`;
        }
        if (Array.isArray(info.profiles)) {
          renderProfiles(info.profiles);
        }
      } catch (_) {}
    }

    async function pollTick() {
      pollTicks++;
      await loadHostStatus();
      if (pollTicks % 30 === 0) loadAccountStatus();
      const token = getToken();
      if (token) {
        await sendCmd('GETACCINFO', { token }, true);
        await sendCmd('GETDEVICELIST', { token }, true);
      }
    }

    async function refreshAll() {
      await loadHostStatus();
      await loadAccountStatus();
      await sendCmd('GETROUTERINFO', {}, true);
      const token = getToken();
      if (token) {
        await sendCmd('GETACCINFO', { token }, true);
        await sendCmd('GETDEVICELIST', { token }, true);
        await sendCmd('GETNETWORKSTATE', { token }, true);
      }
    }

    refreshAll();
    setInterval(pollTick, 2000);
  </script>
</body>
</html>
